name: CI and deploy

# Every pull request is built and tested. A merge to main is deployed to kleoma.com.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    a token with Account > Workers Scripts: Edit, Zone > Workers Routes: Edit, Zone > DNS: Edit (zone kleoma.com)
#   CLOUDFLARE_ACCOUNT_ID   7f883a123499f8c9e2a062fd110505ce

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          sleep 15
          curl -fsS -D - -o /dev/null https://kleoma.com/ | tee /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          curl -fsS https://kleoma.com/ | grep -q '<h1'
